<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" preserveAspectRatio="none">
  <defs>
    <linearGradient id="horizontal">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".035" stop-color="white" stop-opacity="0"/>
      <stop offset=".10" stop-color="white" stop-opacity=".35"/>
      <stop offset=".22" stop-color="white" stop-opacity="1"/>
      <stop offset=".78" stop-color="white" stop-opacity="1"/>
      <stop offset=".90" stop-color="white" stop-opacity=".35"/>
      <stop offset=".965" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vertical" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="white" stop-opacity="0"/>
      <stop offset=".12" stop-color="white" stop-opacity="1"/>
      <stop offset=".80" stop-color="white" stop-opacity="1"/>
      <stop offset="1" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="vertical-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="400" style="mask-type:alpha">
      <rect width="1000" height="400" fill="url(#vertical)"/>
    </mask>
    <filter id="diffuse" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".018 .025" numOctaves="3" seed="12" result="cloud"/>
      <feDisplacementMap in="SourceGraphic" in2="cloud" scale="65" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <g filter="url(#diffuse)">
    <rect width="1000" height="400" fill="url(#horizontal)" mask="url(#vertical-mask)"/>
  </g>
</svg>
